---
layout: compress
---
<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ site.title }} - Homepage</title>
    <link rel="icon" type="image/png" href="{{ site.author.favicon | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/tianxing-source.css?v=20260922-4' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/homepage-publications.css?v=20260922-1' | relative_url }}">
  </head>
  <body>
    <!--
      THESIS: Junhao's academic work is presented in the same direct, editorial homepage grammar as the reference source.
      OWN-WORLD: Outfit typography, progressive nav blur, full-width soft bands, ruled rows, and compact publication thumbnails.
      STORY: A visitor meets the researcher, scans updates and training, then reaches papers and contact links without sidebar friction.
      FIRST VIEWPORT: Fixed navigation, two-column intro, portrait, role line, research statement, and profile links.
      FORM: Tianxing Chen source structure reused as the page system; all facts, media, and links belong to Junhao Cai.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    {% if page.lang == 'zh' %}
    <nav class="page-toc" aria-label="页面导航">
      <a href="#about" class="is-active">关于我</a>
      <a href="#news">动态</a>
      <a href="#education">教育</a>
      <a href="#publications">论文</a>
      <a href="#honors">荣誉</a>
      <a href="#services">服务</a>
    </nav>
    {% else %}
    <nav class="page-toc" aria-label="Page navigation">
      <a href="#about" class="is-active">About</a>
      <a href="#news">News</a>
      <a href="#education">Education</a>
      <a href="#publications">Publications</a>
      <a href="#honors">Honors</a>
      <a href="#services">Services</a>
    </nav>
    {% endif %}
    {{ content }}
    <script>
      (function () {
        var nav = document.getElementById('nav');
        var toggle = document.getElementById('nav-toggle');
        var links = document.getElementById('nav-links');
        if (toggle && nav && links) {
          toggle.addEventListener('click', function () {
            var open = nav.classList.toggle('is-open');
            document.body.classList.toggle('nav-open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
          });
          links.querySelectorAll('a').forEach(function (link) {
            link.addEventListener('click', function () {
              nav.classList.remove('is-open');
              document.body.classList.remove('nav-open');
              toggle.setAttribute('aria-expanded', 'false');
            });
          });
        }

        var reveal = function () {
          document.querySelectorAll('.reveal').forEach(function (node) { node.classList.add('visible'); });
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reveal); else reveal();

        var pageToc = document.querySelector('.page-toc');
        if (pageToc) {
          var tocLinks = Array.prototype.slice.call(pageToc.querySelectorAll('a'));
          var tocSections = tocLinks.map(function (link) { return document.querySelector(link.getAttribute('href')); }).filter(Boolean);
          var updatePageToc = function () {
            pageToc.classList.toggle('is-visible', window.scrollY > 280);
            var marker = window.scrollY + 140;
            var activeIndex = 0;
            tocSections.forEach(function (section, index) {
              if (section.offsetTop <= marker) activeIndex = index;
            });
            tocLinks.forEach(function (link, index) { link.classList.toggle('is-active', index === activeIndex); });
          };
          window.addEventListener('scroll', updatePageToc, { passive: true });
          window.addEventListener('resize', updatePageToc);
          updatePageToc();
        }
      })();

      function toggleNews() {
        var list = document.getElementById('news-list');
        var button = document.getElementById('news-toggle-btn');
        if (!list || !button) return;
        var expanded = list.classList.toggle('news-expanded');
        button.textContent = expanded ? 'Show less ↑' : 'Show more ↓';
      }
    </script>
  </body>
</html>
